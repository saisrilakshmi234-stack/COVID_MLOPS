apiVersion: apps/v1
kind: Deployment
metadata:
  name: covid-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: covid-api
  template:
    metadata:
      labels:
        app: covid-api
    spec:
      containers:
        - name: covid-api
          image: covid-mlops-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000