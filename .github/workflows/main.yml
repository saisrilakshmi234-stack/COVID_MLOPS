name: COVID MLOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test COVID API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx2 pytest requests uvicorn

      - name: Start API server on port 8000
        run: |
          nohup python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8000/health && break
            sleep 2
          done

      - name: Build and run Docker container on port 8002
        run: |
          docker build -t covid-mlops-api:latest .
          docker run -d -p 8002:8000 --name covid-api covid-mlops-api:latest
          for i in $(seq 1 30); do
            curl -s http://localhost:8002/health && break
            sleep 2
          done

      - name: Run tests
        run: python -m pytest tests/ -v -s

      - name: Show logs if failed
        if: failure()
        run: |
          echo "---- server.log ----"
          cat server.log || true
          echo "---- docker logs ----"
          docker logs covid-api || true
